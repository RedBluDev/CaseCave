<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <link rel = "stylesheet" href = "style.css">
        <link rel = "icon" href = "images/icon-casecave.png">
        <title>The Case Cave</title>
    </head>
    <body>
        <div id = "CaseCave" class = "hidden">
            <img id = "bgImg">

            <div class = "bigDiv" id = "centerDiv1"></div>
            <div class = "bigDiv" id = "centerDiv2"></div>

            <div class = "bigDiv" id = "cornerDiv1"></div>
            <div class = "bigDiv" id = "cornerDiv2"></div>
            <div class = "bigDiv" id = "cornerDiv3"></div>
            <div class = "bigDiv" id = "cornerDiv4"></div>

            <div class = "bigDiv" id = "socialDiv1">
                <a class = "smlDiv" id = "github" rel = "noopener noreferrer" target = "_blank" href = "https://github.com/RedBluDev/CaseCave"><img src = "images/icon-github.png"></a>
            </div>
            <div class = "bigDiv" id = "socialDiv2">
                <a class = "smlDiv" id = "itchio" rel = "noopener noreferrer" target = "_blank" href = "https://redbludev.itch.io/casecave"><img src = "images/icon-itchio.png"></a>
            </div>
            
            <div class = "bigDiv" id = "itemColumn1"></div>
            <div class = "bigDiv" id = "itemColumn2"></div>
            <div class = "bigDiv" id = "itemColumn3"></div>
            <div class = "bigDiv" id = "toolRow"></div>

            <img id = "logoImg" src = "images/logo-casecave.png">
            
            <img class = "bigBtn" id = "centerBtn">

            <img class = "bigBtn" id = "navUp" src = "images/nav-up.png">
            <img class = "bigBtn" id = "navDn" src = "images/nav-dn.png">
            <img class = "bigBtn" id = "navLt" src = "images/nav-lt.png">
            <img class = "bigBtn" id = "navRt" src = "images/nav-rt.png">
            <img class = "bigBtn" id = "navBd" src = "images/nav-bd.png">
            <img class = "bigBtn" id = "navFd" src = "images/nav-fd.png">

            <img class = "bigBtn" id = "load"  src = "images/btn-load.png">
            <img class = "bigBtn" id = "save"  src = "images/btn-save.png">
            <img class = "bigBtn" id = "reset" src = "images/btn-reset.png">
            <img class = "bigBtn" id = "skip"  src = "images/btn-reset.png">
        </div>
        <script src = "script.js"></script>
    </body>
</html>
